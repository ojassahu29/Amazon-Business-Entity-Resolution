[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "Scalable machine learning pipeline for cross-source Business Entity Resolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pyahocorasick>=2.1.0",
    "rapidfuzz>=3.6.0",
    "lightgbm>=4.3.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]
